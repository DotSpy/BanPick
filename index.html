<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('banpick-theme')==='light'?'light':'dark'}catch(e){document.documentElement.dataset.theme='dark'}try{var w=localStorage.getItem('banpick-width');document.documentElement.dataset.width=w==='wide'||w==='full'?w:'compact'}catch(e){document.documentElement.dataset.width='compact'}</script>
    <title>BanPick builder</title>
  </head>
  <body>
    <header class="app-header"><a href="./">BanPick</a><span>pick &amp; ban drafts</span></header>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
